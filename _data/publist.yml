- title: "SelfCode 2.0: An annotated corpus of student and expert line-by-line explanations of code examples for automated assessment"
  category: data_corpus
  image: publications/pub-12-selfcode-corpus.png
  image_alt: "Illustration of a labeled dataset of paired explanations"
  description: "Introduces SelfCode 2.0, a corpus of 3,019 student-expert explanation pairs for Java snippets, with expert labels for semantic similarity, correctness, and completeness to train models that assess learners' self-explanations. Includes baseline results using TF-IDF and Sentence-BERT toward stronger automated assessment in programming education."
  link:
    url: "https://par.nsf.gov/biblio/10613654"
    display: Paper
