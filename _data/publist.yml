- title: "Are LLMs actually good for learning?"
  description: "When are LLMs bad for learning? In our view, LLMs are bad for learning when they eliminate productive struggle. Unrestricted access to LLMs is fundamentally at odds with effective learning because they do too much for the learner."
  link:
    url: "https://link.springer.com/article/10.1007/s00146-025-02323-9"
    display: Paper
  highlight: 1

